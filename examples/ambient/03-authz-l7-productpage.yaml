# [L7] waypoint가 집행하는 정책: selector 대신 targetRefs로 Service를 가리킨다.
# curl 서비스 어카운트의 GET 요청만 허용한다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: productpage-waypoint
  namespace: default
spec:
  targetRefs:
  - kind: Service
    group: ""
    name: productpage
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/default/sa/curl
    to:
    - operation:
        methods: ["GET"]
