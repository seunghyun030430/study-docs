# reviews 서비스로 가는 메시 내부 트래픽을 v1 90% / v2 10%로 나눈다(waypoint가 처리).
# reviews-v1, reviews-v2 Service는 samples/bookinfo/platform/kube/bookinfo-versions.yaml이 만든다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: default
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: reviews
    port: 9080
  rules:
  - backendRefs:
    - name: reviews-v1
      port: 9080
      weight: 90
    - name: reviews-v2
      port: 9080
      weight: 10
